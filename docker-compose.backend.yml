services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aid_healthcare}
      POSTGRES_USER: ${POSTGRES_USER:-aid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - backend_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 8

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - backend_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${AID_ENV_FILE:-.env.production}
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-aid}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-aid_healthcare}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AID_RUN_MIGRATIONS: ${AID_RUN_MIGRATIONS:-true}
      AID_COLLECTSTATIC: ${AID_COLLECTSTATIC:-true}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - backend_static:/app/staticfiles
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/aid-backend.conf:/etc/nginx/conf.d/default.conf:ro
      - backend_static:/srv/aid/static:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_postgres_data:
  backend_redis_data:
  backend_static:
